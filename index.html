<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공간의 탑 21층</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontCss" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" media="print">
<style>
:root{
  color-scheme:dark;
  /* 네온 다크 모드: 진한 네이비·보라 배경 + 네온 핑크/퍼플 */
  --bg1:#05041a; --bg2:#130d33;
  --panel:rgba(14,10,38,.88); --panel2:#1c1546; --line:rgba(190,110,255,.38);
  --gold:#ff5cf0; --neon2:#a855f7; --cyan:#3ee0ff; --coin:#ffd166; --text:#f3eeff; --muted:#a99bd6;
  --ok:#3ddc97; --bad:#ff5d73; --exp:#4cc9f0; --mhp:#b388ff;
  --paper:#fdf6e6;
  --disp:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#05041a}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--body);color:var(--text);
  background:
    linear-gradient(rgba(140,90,255,.07) 1px,transparent 1px) 0 0/34px 34px,
    linear-gradient(90deg,rgba(140,90,255,.07) 1px,transparent 1px) 0 0/34px 34px,
    radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.7) 50%,transparent 51%) 0 0/180px 180px,
    radial-gradient(1px 1px at 70% 80%,rgba(255,255,255,.5) 50%,transparent 51%) 0 0/240px 240px,
    radial-gradient(1.5px 1.5px at 40% 60%,rgba(255,230,170,.6) 50%,transparent 51%) 0 0/310px 310px,
    radial-gradient(ellipse at 15% 0%,rgba(255,60,220,.18),transparent 45%),
    radial-gradient(ellipse at 85% 100%,rgba(120,60,255,.2),transparent 50%),
    radial-gradient(ellipse at 50% -10%,#2a1a66 0%,var(--bg2) 35%,var(--bg1) 80%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}

/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:14px;max-width:1240px;margin:0 auto;padding:12px 16px 4px}
.brand{font-family:var(--disp);font-size:24px;color:#ffe9fd;white-space:nowrap;text-shadow:0 0 6px #ff5cf0,0 0 18px #c04dff,0 0 36px rgba(168,85,247,.8)}
.brand small{font-size:14px;color:var(--muted);margin-left:6px;text-shadow:none}
#tower{flex:1;display:flex;gap:3px;align-items:flex-end;min-width:0}
#tower i{flex:1;height:12px;border-radius:3px;background:rgba(255,255,255,.12);position:relative}
#tower i.boss{height:18px}
#tower i.done{background:linear-gradient(#ff8af2,#a855f7);box-shadow:0 0 6px rgba(255,92,240,.6)}
#tower i.cur{background:#fff;box-shadow:0 0 12px 3px rgba(255,92,240,.95);animation:pulse 1s infinite alternate}
#tower i.t2{margin-left:6px}
@keyframes pulse{to{opacity:.55}}
.tbtns{display:flex;gap:6px}
.tbtns button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;width:40px;height:36px;font-size:18px}

/* ---------- layout ---------- */
#app{max-width:1240px;margin:0 auto;padding:8px 16px 28px;display:grid;gap:14px;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"battle scene" "quiz quiz"}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;position:relative;
  box-shadow:0 0 0 1px rgba(168,85,247,.12),0 0 28px rgba(168,85,247,.16),inset 0 0 40px rgba(120,60,255,.06),0 12px 30px rgba(0,0,0,.5)}
#battle{grid-area:battle;padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
#scenePanel{grid-area:scene;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:360px}
#quiz{grid-area:quiz;padding:16px 18px}

/* ---------- battle ---------- */
.floorline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#floorTxt{font-family:var(--disp);font-size:26px;color:#ffe9fd;text-shadow:0 0 8px #ff5cf0,0 0 20px #c04dff}
#tierTxt{font-size:13px;color:var(--muted);text-align:right}
.status{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.unit{background:rgba(0,0,0,.25);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.uname{font-family:var(--disp);font-size:17px;display:flex;justify-content:space-between;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.uname .nm{overflow:hidden;text-overflow:ellipsis}
.uname .lv{font-size:14px;color:var(--gold)}
.boss{font-style:normal;background:#ff3d6b;color:#fff;font-size:11px;padding:1px 6px;border-radius:6px;margin-right:4px;vertical-align:2px}
.bar{position:relative;height:18px;background:#1b1535;border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .5s ease}
.bar span{position:relative;display:block;text-align:center;font-size:11.5px;line-height:16px;font-weight:700;text-shadow:0 1px 2px #000}
.bar.hp i{background:linear-gradient(90deg,#ff5d73,#ff9f6b)}
.bar.hp.low i{animation:pulse .5s infinite alternate}
.bar.exp{height:12px}.bar.exp span{font-size:10px;line-height:10px}
.bar.exp i{background:linear-gradient(90deg,#4cc9f0,#7b8cff)}
.bar.mhp i{background:linear-gradient(90deg,#7c3aed,#ff5cf0);box-shadow:0 0 10px rgba(255,92,240,.6)}
.mstars{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.mstars .st{color:#ffd23f;letter-spacing:1px;text-shadow:0 0 6px rgba(255,210,63,.7);font-size:13px}
.mstars .st i{font-style:normal;color:rgba(255,255,255,.18);text-shadow:none}
.mstars .en{font-family:var(--disp);color:#d9c8ff;overflow:hidden;text-overflow:ellipsis}
/* 보스 전용 HP바 */
#bossBar{position:relative;border-radius:12px;padding:6px 10px 8px;background:linear-gradient(90deg,rgba(255,40,120,.18),rgba(120,40,255,.18));
  border:1px solid rgba(255,80,160,.7);box-shadow:0 0 18px rgba(255,40,140,.45),inset 0 0 18px rgba(255,40,140,.15);animation:bossGlow 1.4s ease-in-out infinite alternate}
@keyframes bossGlow{to{box-shadow:0 0 28px rgba(255,40,140,.75),inset 0 0 22px rgba(255,40,140,.25)}}
.bbtop{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:16px;margin-bottom:5px;white-space:nowrap;overflow:hidden}
.bbtag{background:#ff2d6b;color:#fff;font-size:12px;padding:1px 8px;border-radius:6px;letter-spacing:1px;animation:pulse .6s infinite alternate}
#bossName{color:#fff;text-shadow:0 0 8px #ff3dd1;overflow:hidden;text-overflow:ellipsis}
#bossStars{margin-left:auto;color:#ffd23f;font-size:13px;text-shadow:0 0 6px rgba(255,210,63,.7)}
.bbar{position:relative;height:20px;border-radius:6px;background:#12081e;border:1px solid rgba(255,255,255,.18);overflow:hidden}
.bbar i{position:absolute;left:0;top:0;bottom:0;width:100%}
#bossTrail{background:#fff;opacity:.75;transition:width .9s ease .35s}
#bossFill{background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 2px,transparent 2px 24px),linear-gradient(90deg,#ff2d6b,#ff5cf0 55%,#a855f7);transition:width .35s ease;box-shadow:0 0 12px #ff3dd1}
#bossHpTxt{position:relative;display:block;text-align:center;font-size:12px;font-weight:800;line-height:18px;text-shadow:0 1px 3px #000}
#bossSkill{position:absolute;left:50%;top:42%;z-index:6;transform:translate(-50%,-50%);font-family:var(--disp);font-size:clamp(24px,4vw,38px);color:#fff;white-space:nowrap;pointer-events:none;
  text-shadow:0 0 10px #ff2d6b,0 0 26px #ff2d6b,0 0 44px #a855f7;opacity:0}
#bossSkill.on{animation:skillTxt 1.2s ease-out}
@keyframes skillTxt{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.shock{position:absolute;z-index:5;width:60px;height:60px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%) scale(.3);
  border:6px solid #ff3dd1;box-shadow:0 0 30px #ff3dd1,inset 0 0 20px #a855f7;animation:shock .7s ease-out forwards}
@keyframes shock{to{transform:translate(-50%,-50%) scale(7);opacity:0}}
#flash.boss{background:radial-gradient(ellipse,rgba(255,40,140,.2) 20%,rgba(140,40,255,.75))}
.shakehard{animation:shakehard .6s}
@keyframes shakehard{0%,100%{transform:none}10%{transform:translate(-14px,6px)}25%{transform:translate(12px,-8px)}40%{transform:translate(-10px,4px)}55%{transform:translate(8px,-4px)}70%{transform:translate(-5px,2px)}85%{transform:translate(3px,0)}}
#stage{position:relative;flex:1;min-height:160px;border-radius:14px;overflow:hidden;border:1px solid rgba(168,85,247,.25);
  background:
    linear-gradient(rgba(190,110,255,.12) 1px,transparent 1px) 0 100%/100% 14px,
    linear-gradient(180deg,rgba(60,30,130,.45),rgba(20,12,50,.25) 62%,rgba(255,92,240,.2) 63%,rgba(10,6,28,.85));
  display:flex;align-items:flex-end;justify-content:space-around;padding:0 8% 14px}
.sprite{font-size:70px;line-height:1;position:relative;z-index:2;user-select:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.45))}
.sprite>span{display:inline-block;animation:bob 2.2s ease-in-out infinite}
#heroSprite>span{line-height:0}
.sprite .chsvg{width:1.3em;height:1.58em;display:block;overflow:visible}
.sprite.cast{animation:cast .45s ease}
@keyframes cast{40%{transform:translateX(-10px) rotate(-7deg) scale(1.06)}75%{transform:translateX(8px)}}
.proj{position:absolute;left:0;top:0;z-index:4;pointer-events:none;transform:translate(-50%,-50%)}
.proj.orb{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,#d8c2ff 30%,#8a5cf0 60%,rgba(138,92,240,0) 72%);box-shadow:0 0 18px 8px rgba(180,140,255,.75)}
.proj.arrow svg{width:56px;height:14px;display:block;filter:drop-shadow(0 0 6px #7af0ff)}
.proj.cube svg{width:30px;height:30px;display:block}
.burst{position:absolute;z-index:4;width:70px;height:70px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%) scale(.2);
  border:4px solid var(--bc,#fff);box-shadow:0 0 18px var(--bc,#fff);animation:burst .45s ease-out forwards}
@keyframes burst{to{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
/* ---------- character select ---------- */
.mbox.wide{max-width:980px}
.titlehead{text-align:center}
.titlehead p{margin:4px 0 0;color:var(--muted)}
.steph{font-family:var(--disp);font-weight:400;font-size:20px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.steph i{font-style:normal;background:var(--gold);color:#2a1f5c;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ccard{position:relative;border:2px solid rgba(255,255,255,.12);border-radius:18px;padding:10px 10px 12px;text-align:center;
  background:#2b2456;background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 30%,#2b2456),#201a46 70%);display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:transform .15s,border-color .15s,box-shadow .15s}
.ccard:hover{transform:translateY(-4px);border-color:var(--cc)}
.ccard .cimg{width:100%;aspect-ratio:140/170;max-height:200px;border-radius:14px;background:radial-gradient(ellipse at 50% 60%,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);display:flex;justify-content:center}
.ccard .cimg .chsvg{height:100%;width:auto;transition:transform .3s}
.ccard b{font-family:var(--disp);font-weight:400;font-size:22px;margin-top:2px}
.ccard b small{font-family:var(--body);font-size:11px;color:var(--muted);margin-left:4px;font-weight:700}
.ccard .ctitle{font-size:12.5px;font-weight:800;color:var(--cc);background:rgba(0,0,0,.3);padding:2px 9px;border-radius:10px;filter:brightness(1.35)}
.ccard .cdesc{font-size:12.5px;color:#ddd5f5;line-height:1.45;word-break:keep-all;min-height:36px}
.ccard .cskill{font-size:12px;font-weight:800;color:var(--gold);line-height:1.35;word-break:keep-all}
.ccard.sel{border-color:var(--cc);box-shadow:0 0 0 4px rgba(255,255,255,.35);box-shadow:0 0 0 4px color-mix(in srgb,var(--cc) 45%,transparent),0 0 30px color-mix(in srgb,var(--cc) 60%,transparent);transform:translateY(-4px)}
.ccard.sel .cimg .chsvg{animation:selhop .6s cubic-bezier(.2,1.6,.4,1)}
.ccard.sel::after{content:'✔';position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--cc);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.cards.picked .ccard:not(.sel){opacity:.55;filter:saturate(.6)}
@keyframes selhop{30%{transform:translateY(-14px) scale(1.06)}}
.step2{margin-top:6px;transition:opacity .3s}
.step2.off{opacity:.38;pointer-events:none}
.namerow{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.25);border-radius:16px;padding:10px 12px}
.selprev{width:64px;height:78px;flex:none}
.selprev .chsvg{width:100%;height:100%}
.namerow .nameinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.namerow .say{font-size:13.5px;color:#ffe6a6;font-weight:700;word-break:keep-all}
.contbox{display:flex;align-items:center;gap:12px;background:rgba(255,209,102,.1);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-top:12px}
.contbox .selprev{width:46px;height:56px}
.contbox div.ct{flex:1;font-size:14px}
details.fold{margin-top:12px;background:rgba(0,0,0,.2);border-radius:12px;padding:8px 12px}
details.fold summary{cursor:pointer;font-family:var(--disp);font-size:16px}
.cert .chsvg{width:90px;height:110px}
@keyframes bob{50%{translate:0 -6px}}
#monSprite{filter:drop-shadow(0 6px 4px rgba(0,0,0,.5)) drop-shadow(0 0 10px rgba(192,77,255,.7))}
#monSprite.isboss{font-size:96px;filter:drop-shadow(0 0 16px rgba(255,45,107,.85)) drop-shadow(0 0 30px rgba(168,85,247,.6))}
.sprite .mnsvg{width:1.45em;height:1.45em;display:block;overflow:visible}
#vs{font-family:var(--disp);color:rgba(255,255,255,.25);font-size:22px;align-self:center}
.sprite.atk{animation:lunge .5s ease}
.sprite.matk{animation:lungeL .5s ease}
@keyframes lunge{40%{transform:translateX(var(--dx,90px)) rotate(12deg) scale(1.12)}}
@keyframes lungeL{40%{transform:translateX(calc(var(--dx,90px) * -1)) rotate(-12deg) scale(1.12)}}
.sprite.hit{animation:hit .45s ease}
@keyframes hit{0%,100%{transform:none;filter:none}20%{transform:translateX(-10px);filter:brightness(3)}40%{transform:translateX(9px)}60%{transform:translateX(-6px);filter:brightness(2)}80%{transform:translateX(4px)}}
.sprite.appear{animation:appear .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes appear{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.sprite.dead{animation:die .9s ease forwards}
@keyframes die{30%{transform:scale(1.25);filter:brightness(3)}100%{transform:scale(.1) rotate(60deg) translateY(40px);opacity:0;filter:grayscale(1)}}
#slash{position:absolute;width:150px;height:10px;border-radius:10px;pointer-events:none;opacity:0;z-index:3;
  background:linear-gradient(90deg,transparent,#fff 40%,#fff6c2 60%,transparent);box-shadow:0 0 18px 4px rgba(255,240,180,.8)}
#slash.on{animation:slash .35s ease-out}
@keyframes slash{0%{opacity:0;transform:rotate(-35deg) scaleX(.1)}30%{opacity:1}100%{opacity:0;transform:rotate(-35deg) scaleX(1.25)}}
.pop{position:absolute;z-index:5;font-family:var(--disp);font-size:30px;pointer-events:none;white-space:nowrap;
  text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.6);animation:popup 1.1s ease-out forwards;transform:translateX(-50%)}
.pop.crit{font-size:40px;color:#ffe066}
.pop.dmg{color:#fff}.pop.hurt{color:#ff6b81}.pop.heal{color:#5cf2a8}.pop.gold{color:var(--coin);font-size:22px}
@keyframes popup{0%{opacity:0;margin-top:10px;scale:.6}15%{opacity:1;scale:1.15}100%{opacity:0;margin-top:-60px;scale:1}}
.bubble{position:absolute;right:6%;top:10px;max-width:62%;background:#fff;color:#2a1f5c;font-size:13px;font-weight:700;
  padding:6px 10px;border-radius:12px;z-index:4;animation:fadeio 3s forwards}
@keyframes fadeio{0%{opacity:0;transform:translateY(6px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
.statline{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.statline b{color:var(--text)}
.statline .cmb b{color:#ff9f43}
#goldTxt{color:var(--coin)}

/* ---------- scene ---------- */
.scenehead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
#sceneLabel{font-family:var(--disp);font-size:17px;color:#ffd6fb;text-shadow:0 0 8px rgba(255,92,240,.7)}
#lockBadge{font-size:12px;color:var(--muted);background:rgba(0,0,0,.3);padding:3px 8px;border-radius:8px;white-space:nowrap}
#lockBadge.nudge{animation:hit .4s}
#canvasWrap{position:relative;flex:1;min-height:250px;border-radius:14px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,rgba(120,70,230,.35),rgba(6,4,22,.6));border:1px solid rgba(168,85,247,.2)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#scene.rot{cursor:grab;touch-action:none}
#hintLabel{position:absolute;left:10px;top:10px;background:rgba(255,209,102,.95);color:#2a1f5c;font-weight:800;font-size:13px;
  padding:4px 10px;border-radius:10px;pointer-events:none}
.viewbtns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.viewbtns button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-family:var(--disp);font-size:15px}
.viewbtns button:disabled{opacity:.35}

/* ---------- quiz ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.chip{background:rgba(255,209,102,.16);color:var(--gold);border:1px solid var(--line);padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700}
#qNo{font-size:13px;color:var(--muted)}
#qText{font-size:19px;line-height:1.55;font-weight:700;word-break:keep-all}
#qText small{display:block;font-size:13.5px;color:var(--muted);font-weight:500;margin-top:2px}
#qHint{margin-top:8px;background:rgba(255,209,102,.12);border:1px dashed var(--gold);color:#ffe6a6;padding:8px 12px;border-radius:10px;font-size:14.5px;word-break:keep-all}
#qFigs{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 4px}
.fig{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.paper{background:var(--paper);border-radius:10px;padding:8px;display:flex;align-items:center;justify-content:center}
.fig figcaption{font-size:13px;color:var(--muted);font-weight:700}
.msvg{max-width:100%;height:auto;display:block}
#options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
#options.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{position:relative;background:var(--panel2);border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 8px 10px;
  min-height:96px;display:flex;align-items:center;justify-content:center;transition:transform .12s,border-color .12s,background .12s}
.opt:not(:disabled):hover{transform:translateY(-3px);border-color:var(--gold)}
.onum{position:absolute;left:8px;top:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.35);font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;color:var(--gold)}
.otext{font-family:var(--disp);font-size:30px}
.opt .paper{padding:6px;max-width:100%}
.opt .paper .msvg{max-height:132px;width:auto}
.opt canvas.mini{width:100%;height:132px;display:block;border-radius:10px;background:rgba(0,0,0,.25)}
.opt.cube{padding:26px 6px 6px}
.opt.correct{border-color:var(--ok);background:#1e4a3b;box-shadow:0 0 0 4px rgba(61,220,151,.25)}
.opt.wrong{border-color:var(--bad);background:#4d1f2d;animation:hit .45s}
.opt.elim{opacity:.25}
.opt.elim::after{content:'✕';position:absolute;font-size:56px;color:var(--bad);font-weight:900}
.opt:disabled:not(.correct):not(.wrong){opacity:.55}
.opt.elim:disabled{opacity:.25}
#feedback{margin-top:14px;border-radius:14px;padding:14px 16px;border:1px solid}

.fbtitle{font-family:var(--disp);font-size:22px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rew{font-family:var(--body);font-size:13px;font-weight:700;background:rgba(0,0,0,.3);padding:3px 8px;border-radius:8px;color:var(--gold)}
.fbexp{margin-top:8px;font-size:15.5px;line-height:1.65;word-break:keep-all}
.fbexp .figs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.fbrow{display:flex;justify-content:flex-end;margin-top:10px}
.big{font-family:var(--disp);font-size:19px;border:none;border-radius:14px;padding:11px 22px;
  background:linear-gradient(180deg,#ff7af2,#a855f7);color:#fff;text-shadow:0 1px 2px rgba(60,0,80,.6);box-shadow:0 4px 0 #5b1f8f,0 0 20px rgba(255,92,240,.45)}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #5b1f8f,0 0 20px rgba(255,92,240,.45)}
.big:disabled{filter:grayscale(.8);opacity:.6}
.big.ghost{background:var(--panel2);color:var(--text);box-shadow:0 4px 0 #120d2a;border:1px solid var(--line)}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.actions button{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;font-family:var(--disp);font-size:17px}
.actions button b{background:rgba(255,209,102,.2);color:var(--gold);border-radius:8px;padding:0 7px;margin-left:4px}
#btnShop{background:linear-gradient(180deg,#7c3aed,#4c1d95);box-shadow:0 0 14px rgba(168,85,247,.45)}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;z-index:50;background:rgba(8,6,22,.74);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:linear-gradient(180deg,#1e1450,#0d0a2a);box-shadow:0 0 0 1px rgba(255,92,240,.2),0 0 40px rgba(168,85,247,.35),0 20px 60px rgba(0,0,0,.6)!important;border:1px solid var(--line);border-radius:20px;max-width:560px;width:100%;
  max-height:92vh;overflow:auto;padding:22px 22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:appear .35s ease}
.mbox h2{font-family:var(--disp);font-weight:400;color:#ffe9fd;text-shadow:0 0 8px #ff5cf0,0 0 22px #a855f7;margin:0 0 8px;font-size:30px;text-align:center;word-break:keep-all}
.mbox h3{font-family:var(--disp);font-weight:400;margin:14px 0 6px;font-size:19px}
.mbox p,.mbox li{line-height:1.6;font-size:15px;word-break:keep-all}
.mbox ul{padding-left:20px;margin:6px 0}
.mrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.mtitle-emoji{text-align:center;font-size:56px;line-height:1.1}
.namein{width:100%;font-size:18px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#120e2c;color:var(--text);font-family:var(--disp)}
.shopitem{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px;margin:8px 0}
.shopitem .ic{font-size:30px;width:40px;text-align:center}
.shopitem .info{flex:1;min-width:0}
.shopitem .info b{font-family:var(--disp);font-weight:400;font-size:17px}
.shopitem .info div{font-size:13px;color:var(--muted)}
.shopitem button{min-width:84px;border:none;border-radius:10px;padding:8px 10px;font-weight:800;background:linear-gradient(180deg,#ff7af2,#a855f7);color:#fff}
.shopitem button.sell{background:#2a2058;border:1px solid var(--line);color:#e9ddff;min-width:70px}
.shopitem .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.shopitem button:disabled{background:#4a4370;color:#aaa}
.goldline{text-align:center;font-family:var(--disp);font-size:20px;color:var(--coin)}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:10px}
.dexcard{position:relative;border:1px solid var(--line);border-radius:12px;padding:22px 6px 8px;text-align:center;
  background:linear-gradient(180deg,rgba(60,30,130,.5),rgba(10,6,30,.9));box-shadow:inset 0 0 18px rgba(168,85,247,.15)}
.dexcard.boss{border-color:rgba(255,80,160,.75);box-shadow:0 0 14px rgba(255,40,140,.35),inset 0 0 18px rgba(255,40,140,.15)}
.dexcard .fl{position:absolute;left:6px;top:5px;font-family:var(--disp);font-size:12px;background:rgba(0,0,0,.5);padding:1px 7px;border-radius:6px}
.dexcard .bt{position:absolute;right:6px;top:5px;font-size:10px;font-weight:900;background:#ff2d6b;color:#fff;padding:1px 6px;border-radius:6px}
.dexcard .mnsvg{width:84px;height:84px;filter:drop-shadow(0 0 8px rgba(192,77,255,.75))}
.dexcard.locked .mnsvg{filter:brightness(0) drop-shadow(0 0 2px rgba(168,85,247,.9));opacity:.8}
.dexcard b{display:block;font-family:var(--disp);font-weight:400;font-size:14.5px;color:#fff}
.dexcard small{display:block;font-size:11px;color:var(--muted)}
.dexcard .st{color:#ffd23f;font-size:12px;letter-spacing:1px}
.dexcard p{font-size:11.5px;line-height:1.4;margin:4px 0 0;color:#d9cff5}
.clearmon{display:flex;justify-content:center}.clearmon .mnsvg{width:120px;height:120px;filter:drop-shadow(0 0 12px rgba(192,77,255,.8))}
.rewards{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:17px;margin:10px 0}
.cert{border:3px double var(--gold);border-radius:16px;padding:16px;text-align:center;background:rgba(255,209,102,.06)}
.cert table{margin:10px auto 0;border-collapse:collapse;font-size:14.5px}
.cert td{padding:3px 10px;border-bottom:1px solid rgba(255,255,255,.1)}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.presets button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;font-family:var(--disp);font-size:16px}
.presets button small{display:block;font-family:var(--body);font-size:11.5px;color:var(--muted);margin-top:2px}
.tip{display:flex;gap:10px;align-items:flex-start;background:rgba(0,0,0,.22);border-radius:12px;padding:10px;margin:8px 0}
.tip .paper{flex:none}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{font-family:var(--disp);font-size:20px;padding:8px 18px;border-radius:30px;background:rgba(20,14,50,.92);border:2px solid var(--gold);
  color:var(--gold);animation:toast 2.2s ease forwards;white-space:nowrap}
.toast.lv{font-size:28px;background:linear-gradient(90deg,#ff5cf0,#a855f7);color:#fff;border-color:#fff;box-shadow:0 0 24px rgba(255,92,240,.7)}
.toast{box-shadow:0 0 16px rgba(255,92,240,.35)}
.toast.warn{border-color:var(--bad);color:#ffb3bf}
@keyframes toast{0%{opacity:0;transform:translateY(14px) scale(.8)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;background:radial-gradient(ellipse,transparent 40%,rgba(255,40,70,.55))}
#flash.on{animation:flash .5s ease}
@keyframes flash{30%{opacity:1}}
.shakeit{animation:hit .45s}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:70;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- timer ---------- */
#timer{display:flex;align-items:center;gap:10px;margin:-2px 0 10px}
#timer .tbar{flex:1;height:12px;border-radius:8px;background:#1b1535;border:1px solid rgba(255,255,255,.12);overflow:hidden}
#timerBar{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3ddc97,#9be15d);border-radius:8px}
#timer.warn #timerBar{background:linear-gradient(90deg,#ffd166,#ff9f43)}
#timer.danger #timerBar{background:linear-gradient(90deg,#ff5d73,#ff3d6b);animation:pulse .4s infinite alternate}
#timerTxt{font-family:var(--disp);font-size:20px;min-width:62px;text-align:right}
#timer.danger #timerTxt{color:var(--bad)}
#diffChip{font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:12px;white-space:nowrap}
#diffChip.easy{background:rgba(61,220,151,.18);color:#7ff0bf}
#diffChip.hard{background:rgba(255,93,115,.2);color:#ff9fae}
/* ---------- hero rank ---------- */
#heroSprite{--aura:transparent;filter:drop-shadow(0 6px 4px rgba(0,0,0,.45)) drop-shadow(0 0 12px var(--aura))}
.sprite .acc{position:absolute;left:-14px;bottom:2px;font-size:.38em;font-style:normal;filter:drop-shadow(0 0 4px rgba(255,255,255,.7))}
.rankname{font-family:var(--body);font-size:11px;font-weight:800;color:#2a1f5c;background:var(--gold);border-radius:6px;padding:1px 5px;margin-right:4px;vertical-align:2px}
/* ---------- floor-entry cinematic ---------- */
#cine{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;cursor:pointer;
  background:radial-gradient(ellipse at 50% 55%,#2c1470 0%,#120a36 55%,#04030f 100%);animation:cineIn .35s ease;--aura:#9aa4c7;--aura2:#9aa4c7}
#cine.out{animation:cineOut .35s ease forwards}
@keyframes cineIn{from{opacity:0}}@keyframes cineOut{to{opacity:0}}
.cine-rays{position:absolute;width:220vmax;height:220vmax;left:50%;top:56%;translate:-50% -50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,92,240,.13) 0 7deg,transparent 7deg 18deg);animation:spin 14s linear infinite;opacity:.25;transition:opacity .5s}
#cine.charge .cine-rays,#cine.boom .cine-rays{opacity:1}
@keyframes spin{to{rotate:360deg}}
.cine-floor{position:relative;font-family:var(--disp);font-size:clamp(40px,8vw,72px);color:#fff;text-shadow:0 0 10px #ff5cf0,0 0 30px #c04dff,0 0 60px #a855f7;animation:slam .7s cubic-bezier(.2,1.5,.4,1)}
.cine-sub{position:relative;font-size:16px;color:#e4dcff;font-weight:700;text-align:center;padding:0 16px;word-break:keep-all}
.cine-hero{position:relative;font-size:clamp(96px,20vw,160px);line-height:1;margin:14px 0 4px}
.cine-hero>span{display:inline-block;line-height:0}
.cine-hero .chsvg{width:1.15em;height:1.4em;display:block;overflow:visible}
.cine-hero .acc{position:absolute;left:-30px;bottom:6px;font-size:.32em;font-style:normal;transition:transform .4s}
.cine-hero .aura{position:absolute;left:50%;top:50%;width:190%;height:190%;translate:-50% -50%;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,var(--aura) 0%,transparent 62%);opacity:.35;transition:opacity .5s,scale .5s;scale:.7}
#cine.charge .aura{opacity:.9;scale:1.05;animation:pulse .18s infinite alternate}
#cine.charge .cine-hero>span{animation:charge .09s infinite}
@keyframes charge{50%{translate:3px -2px}}
#cine.boom .aura{opacity:1;scale:1.25;background:radial-gradient(circle,#fff 0%,var(--aura2) 30%,transparent 64%)}
#cine.boom .cine-hero{animation:heroUp .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes heroUp{0%{scale:1.35}100%{scale:1}}
.cine-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#cine.boom .cine-flash{animation:boomFlash .8s ease-out}
@keyframes boomFlash{0%{opacity:.95}100%{opacity:0}}
.cine-rank{position:relative;font-family:var(--disp);font-size:clamp(22px,4vw,30px);min-height:40px;color:#fff;text-shadow:0 0 16px var(--aura2)}
.cine-rank.new{animation:slam .55s cubic-bezier(.2,1.5,.4,1)}
.cine-rank small{display:block;text-align:center;font-size:14px;color:var(--gold);text-shadow:none}
.cine-stats{position:relative;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:44px;padding:0 12px}
.cine-stats span{background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-family:var(--disp);font-size:18px;opacity:0;animation:slam .45s cubic-bezier(.2,1.5,.4,1) forwards}
.cine-skip{position:absolute;bottom:20px;font-size:13px;color:var(--muted)}
@keyframes slam{0%{opacity:0;scale:2.2}100%{opacity:1;scale:1}}
.spark{position:absolute;left:50%;top:56%;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:spark .9s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.3)}}

/* ---------- 정복 세리머니 ---------- */
#ending{position:fixed;inset:0;z-index:58;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  background:radial-gradient(ellipse at 50% 62%,#3a1a6e 0%,#170b3a 45%,#04020e 100%);animation:cineIn .6s ease}
.end-rays{position:absolute;left:50%;top:62%;width:240vmax;height:240vmax;translate:-50% -50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,214,90,.16) 0 6deg,transparent 6deg 15deg);animation:spin 26s linear infinite;opacity:.9}
.end-halo{position:absolute;left:50%;top:60%;width:min(110vw,1100px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,236,150,.85) 0%,rgba(255,196,60,.45) 18%,rgba(255,92,240,.18) 42%,transparent 62%);animation:haloPulse 2.4s ease-in-out infinite alternate}
@keyframes haloPulse{from{scale:.92;opacity:.85}to{scale:1.06;opacity:1}}
.end-titles{position:relative;z-index:3;text-align:center;margin-top:min(5vh,40px);padding:0 10px}
.end-t1,.end-t2{font-family:var(--disp);line-height:1.1;opacity:0;word-break:keep-all}
.end-t1{font-size:clamp(34px,7.2vw,84px);color:#fff;text-shadow:0 0 8px #ff5cf0,0 0 22px #ff5cf0,0 0 44px #a855f7,0 0 80px #a855f7,0 6px 0 #5b1f8f}
.end-t2{font-size:clamp(22px,4.2vw,46px);margin-top:6px;color:#fff6c8;text-shadow:0 0 8px #ffd23f,0 0 24px #ffb020,0 0 48px #ff8a00}
.end-t1.on,.end-t2.on{animation:slam .7s cubic-bezier(.2,1.5,.4,1) forwards,neonFlick 2.6s 1s infinite}
@keyframes neonFlick{0%,100%{filter:none}48%{filter:none}50%{filter:brightness(1.5)}52%{filter:none}}
.end-stage{position:relative;z-index:2;width:min(94vw,960px);flex:1;max-height:min(62vh,560px);min-height:300px;margin-top:6px}
.end-mon{position:absolute;width:var(--ms);height:var(--ms);translate:-50% -50%;border-radius:50%;opacity:0;
  background:radial-gradient(circle at 50% 40%,#3b2575,#140b30 70%);border:2px solid rgba(190,110,255,.8);box-shadow:0 0 14px rgba(192,77,255,.7)}
.end-mon.on{animation:monPop .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes monPop{0%{opacity:0;scale:.2}100%{opacity:1;scale:1}}
.end-mon .mnsvg{width:84%;height:84%;margin:8%;display:block;filter:drop-shadow(0 0 4px rgba(192,77,255,.8))}
.end-mon.boss{border-color:#ff5c9a;box-shadow:0 0 18px rgba(255,60,140,.85)}
.end-mon .medal{position:absolute;right:-18%;bottom:-16%;width:58%;height:58%;opacity:0}
.end-mon.stamped .medal{animation:stamp .42s cubic-bezier(.3,1.4,.5,1) forwards}
.end-mon.stamped{border-color:#ffd23f;box-shadow:0 0 18px rgba(255,210,63,.9)}
@keyframes stamp{0%{opacity:0;scale:3.2;rotate:-40deg}70%{opacity:1;scale:.9}100%{opacity:1;scale:1;rotate:-12deg}}
.end-heroglow{position:absolute;left:50%;bottom:0;width:min(46vw,300px);aspect-ratio:1;translate:-50% 0;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle,rgba(255,250,210,.95) 0%,rgba(255,210,63,.55) 30%,transparent 66%)}
.end-hero{position:absolute;left:50%;bottom:-40%;width:min(30vw,200px);aspect-ratio:140/170;translate:-50% 0;opacity:0}
.end-hero .chsvg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 16px rgba(255,220,120,.9))}
#ending.rise .end-hero{animation:heroRise 4.2s cubic-bezier(.25,.8,.3,1) forwards}
#ending.rise .end-heroglow{animation:glowRise 4.2s cubic-bezier(.25,.8,.3,1) forwards}
@keyframes heroRise{0%{opacity:0;bottom:-40%}15%{opacity:1}100%{opacity:1;bottom:16%}}
@keyframes glowRise{0%{opacity:0;bottom:-40%}100%{opacity:1;bottom:8%}}
#ending.floaty .end-hero{animation:heroFloat 2.6s ease-in-out infinite alternate;bottom:16%;opacity:1}
#ending.floaty .end-heroglow{bottom:8%;opacity:1}
@keyframes heroFloat{from{translate:-50% 0;rotate:-3deg}to{translate:-50% -14px;rotate:3deg}}
.end-bottom{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 max(20px,4vh)}
.end-count{font-family:var(--disp);font-size:clamp(18px,3vw,26px);color:#ffe9a8;text-shadow:0 0 10px rgba(255,190,40,.9)}
.end-btn{font-size:clamp(20px,3vw,26px);padding:14px 34px;animation:slam .6s cubic-bezier(.2,1.5,.4,1),btnGlow 1.2s .6s infinite alternate}
@keyframes btnGlow{to{box-shadow:0 4px 0 #5b1f8f,0 0 38px rgba(255,92,240,.95),0 0 60px rgba(255,210,63,.6)}}
.end-skip{position:absolute;right:14px;top:12px;z-index:4;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--muted)}
.firework{position:absolute;z-index:1;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:spark 1.1s ease-out forwards}
/* ---------- 명예의 전당 카드 ---------- */
.mbox.hofbox{max-width:860px;background:radial-gradient(ellipse at 50% 0%,#3a1a6e,#0b0624 70%)!important}
.hof-wrap{perspective:1300px;padding:6px 4px 2px}
.hof{position:relative;border-radius:22px;padding:20px 20px 16px;overflow:hidden;transform-style:preserve-3d;
  background:linear-gradient(145deg,#1b1048 0%,#2a1060 40%,#120a33 100%);
  border:3px solid transparent;background-clip:padding-box;
  box-shadow:0 0 0 2px #ffd23f,0 0 0 6px rgba(255,210,63,.25),0 0 40px rgba(255,92,240,.45),0 30px 60px rgba(0,0,0,.6);
  animation:hofIn 1s cubic-bezier(.2,1.2,.3,1);transition:transform .15s ease-out}

  background:linear-gradient(rgba(255,210,63,.08) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(255,210,63,.08) 1px,transparent 1px) 0 0/22px 22px}
.hof-shine{position:absolute;inset:-50%;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.22) 48%,rgba(255,180,250,.18) 52%,transparent 60%);
  transform:translateX(var(--sx,-30%));transition:transform .15s ease-out}
.hof-head{position:relative;text-align:center;font-family:var(--disp);font-size:clamp(20px,3.4vw,30px);letter-spacing:2px;color:#ffe9a8;

.hof-main{position:relative;display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:18px;margin-top:14px;align-items:center}
.hof-portrait{position:relative;border-radius:18px;padding:10px;aspect-ratio:140/170;
  background:radial-gradient(circle at 50% 45%,rgba(255,236,150,.7),rgba(255,92,240,.25) 45%,rgba(20,10,50,.9) 75%);border:2px solid #ffd23f;box-shadow:0 0 24px rgba(255,210,63,.55);transform:translateZ(40px)}
.hof-portrait .chsvg{width:100%;height:100%;display:block;overflow:visible}
.sbadge{position:absolute;left:-12px;top:-12px;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:30px;color:#3b2400;background:radial-gradient(circle at 35% 30%,#fff6c8,#ffd23f 45%,#d48a00);border:3px solid #fff3b0;box-shadow:0 0 18px rgba(255,210,63,.9);rotate:12deg}
.hof-name{font-family:var(--disp);font-size:clamp(28px,4.6vw,42px);color:#fff;text-shadow:0 0 10px #ff5cf0,0 0 24px #a855f7;line-height:1.1;word-break:keep-all}
.hof-title{margin-top:6px;font-family:var(--disp);font-size:clamp(19px,3vw,26px);color:#fff6c8;text-shadow:0 0 10px rgba(255,190,40,.9)}
.hof-title .sclass{font-size:.7em;vertical-align:3px;background:linear-gradient(90deg,#ffd23f,#ff5cf0);color:#2a0d3a;padding:2px 10px;border-radius:10px;margin-left:6px;text-shadow:none}
.hof-sub{font-size:13.5px;color:var(--muted);margin-top:4px}

/* ---------- 메인 화면: 학년 · 모드 ---------- */
.gradegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gbtn{position:relative;border:2px solid rgba(190,110,255,.3);border-radius:16px;padding:12px 8px 12px;text-align:center;display:flex;flex-direction:column;gap:5px;align-items:center;
  background:#160f3a;background:linear-gradient(180deg,color-mix(in srgb,var(--gc) 20%,#160f3a),#0d0928);transition:transform .15s,border-color .15s,box-shadow .15s}
.gbtn:hover{transform:translateY(-3px);border-color:var(--gc)}
.gbtn b{font-family:var(--disp);font-weight:400;font-size:27px;color:#fff;text-shadow:0 0 10px var(--gc),0 0 22px var(--gc)}
.gbtn .lvchip{font-size:12px;font-weight:900;color:#0b0620;background:var(--gc);padding:1px 10px;border-radius:10px}
.gbtn .gd{font-size:12px;color:#d9cff5;line-height:1.45;word-break:keep-all}
.gbtn.sel{border-color:var(--gc);box-shadow:0 0 0 3px rgba(255,255,255,.25),0 0 26px var(--gc);transform:translateY(-3px)}
.gbtn.sel::after,.mcard.sel::after{content:'✔';position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--gc,var(--mc));color:#0b0620;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.mcard.sel::after{background:var(--mc)}
.gradegrid.picked .gbtn:not(.sel),.modegrid.picked .mcard:not(.sel){opacity:.55}
.modegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mcard{position:relative;text-align:left;display:flex;gap:12px;align-items:flex-start;border:2px solid rgba(190,110,255,.3);border-radius:18px;padding:14px 14px 14px 12px;
  background:#160f3a;background:linear-gradient(135deg,color-mix(in srgb,var(--mc) 16%,#160f3a),#0d0928 70%);transition:transform .15s,border-color .15s,box-shadow .15s}
.mcard:hover{transform:translateY(-3px);border-color:var(--mc)}
.mcard.sel{border-color:var(--mc);box-shadow:0 0 0 3px rgba(255,255,255,.22),0 0 26px var(--mc);transform:translateY(-3px)}
.mcard .mi{font-size:40px;line-height:1;filter:drop-shadow(0 0 10px var(--mc))}
.mcard .mt{min-width:0}
.mcard b{font-family:var(--disp);font-weight:400;font-size:22px;color:#fff;display:block;text-shadow:0 0 10px var(--mc)}
.mcard .use{display:inline-block;margin-top:5px;font-size:12px;font-weight:900;color:#0b0620;background:var(--mc);border-radius:8px;padding:1px 9px}
.mcard p{margin:6px 0 0;font-size:13px;color:#d9cff5;line-height:1.55;word-break:keep-all}
.zonebox{margin-top:12px;background:rgba(0,0,0,.25);border:1px dashed rgba(190,110,255,.4);border-radius:14px;padding:10px 12px}
.zlabel{font-family:var(--disp);font-size:15px;color:#d9c8ff;margin-bottom:8px}
.zoneseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.zbtn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 6px;font-family:var(--disp);font-size:16px}
.zbtn small{display:block;font-family:var(--body);font-size:11.5px;color:var(--muted);margin-top:2px;word-break:keep-all}
.zbtn.sel{border-color:#ff5cf0;box-shadow:0 0 14px rgba(255,92,240,.5);background:#2a1a5c}
.selsum{text-align:center;margin-top:12px;font-size:14px;color:#e9ddff}
.selsum i{font-style:normal;color:var(--muted);opacity:.7}
/* ---------- 그림 보기(입체 미니) ---------- */
.figcv{width:160px;height:128px;display:block;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid rgba(190,110,255,.3)}
.cp-nets{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;width:100%}

/* ---------- 개념 원리 탑 탐험 ---------- */
#concept{position:fixed;inset:0;z-index:57;background:rgba(5,3,18,.9);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;
  padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.cp-box{width:min(1120px,100%);height:min(760px,100%);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;overflow:hidden;

.cp-tab{white-space:nowrap}
.cp-tab{background:rgba(0,0,0,.3);border:1px solid rgba(190,110,255,.35);border-radius:20px;padding:5px 12px;font-family:var(--disp);font-size:14px;color:#d9c8ff}
.cp-tab.on{background:linear-gradient(180deg,#ff7af2,#a855f7);color:#fff;border-color:#fff;box-shadow:0 0 14px rgba(255,92,240,.6)}
.cp-tab.done::after{content:' ✔';color:#7cf0a8}
.cp-x{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;width:36px;height:34px;font-size:16px}
#cpBody{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;padding:14px 16px}
.cp-visual{display:flex;flex-direction:column;gap:8px;min-width:0}

.cp-alt.on{background:#3ee0ff;color:#0b0620;border-color:#fff;box-shadow:0 0 14px rgba(62,224,255,.6)}
#cpCwrap{position:relative;width:100%;aspect-ratio:4/3;max-height:52vh;border-radius:16px;overflow:hidden;border:1px solid rgba(168,85,247,.3);
  background:radial-gradient(ellipse at 50% 40%,rgba(120,70,230,.38),rgba(6,4,22,.7))}
#cpCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.cp-ctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.cp-ctl button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-family:var(--disp);font-size:14px}
.cp-ctl .cp-foldbtn{background:linear-gradient(180deg,#ff7af2,#a855f7);color:#fff;border-color:#fff}
.cp-ctl input[type=range]{flex:1;min-width:120px;max-width:240px;accent-color:#ff5cf0}
.cp-right{display:flex;flex-direction:column;gap:12px;min-width:0}
.cp-speaker{display:flex;gap:10px;align-items:flex-end}

.cp-por .chsvg{width:100%;height:100%;display:block;overflow:visible}
.cp-say{flex:1;min-width:0}
.cp-name{font-family:var(--disp);font-size:14px;color:var(--cc);filter:brightness(1.35);margin:0 0 4px 6px}
.cp-bubble{position:relative;background:#f7f2ff;color:#1d1440;border-radius:16px 16px 16px 4px;padding:13px 15px;font-size:17px;line-height:1.7;word-break:keep-all;box-shadow:0 0 22px rgba(255,92,240,.3)}
.cp-bubble b{color:#7a1fd0}
.cp-side{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.cp-qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--disp);font-size:20px;color:#7cf0a8;text-shadow:0 0 10px rgba(61,220,151,.6)}
.cp-qhead small{font-family:var(--body);font-size:12.5px;color:var(--muted);text-shadow:none}
.cp-qtext{font-size:17px;font-weight:700;line-height:1.55;word-break:keep-all}

.cp-fb .fbtitle{font-size:19px}
.cp-done{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.cp-donet{font-family:var(--disp);font-size:clamp(22px,3.2vw,30px);color:#fff;text-shadow:0 0 10px #ff5cf0,0 0 26px #a855f7}
.cp-rew{font-size:16px}.cp-rew b{color:var(--coin);margin:0 4px}
.cp-master{background:linear-gradient(90deg,rgba(255,210,63,.2),rgba(255,92,240,.2));border:1px solid #ffd23f;border-radius:12px;padding:8px 14px;font-size:15px}
.cp-sum{text-align:left;margin:0;padding:10px 14px 10px 30px;background:rgba(0,0,0,.28);border-radius:12px;line-height:1.7;font-size:15px;word-break:keep-all}

.cp-tip{margin:0;font-size:13px;color:var(--muted)}
.cp-nav{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid rgba(190,110,255,.22);flex-wrap:wrap}
.cp-nav .navbtn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 16px;font-family:var(--disp);font-size:16px}
.cp-nav .navbtn:disabled{opacity:.35}
#cpNext{background:linear-gradient(180deg,#ff7af2,#a855f7);color:#fff;border-color:#fff;box-shadow:0 0 14px rgba(255,92,240,.45)}
.cp-dots{flex:1;display:flex;justify-content:center;gap:7px;min-width:80px}

@media (max-width:820px){

<body>
<header id="topbar">
  <div class="brand">🏰 공간의 탑 <small>21층을 올라라</small></div>
  <div id="tower" aria-label="탑 진행도"></div>
  <div class="tbtns">
    <button id="btnMusic" title="배경음악 켜기/끄기">🎵</button>
    <button id="btnSound" title="효과음 켜기/끄기">🔊</button>
    <button id="btnMenu" title="메뉴">☰</button>
  </div>
</header>

<main id="app">
  <!-- 좌측 상단: 전투 -->
  <section id="battle" class="panel">
    <div class="floorline"><span id="floorTxt">1층</span><span id="tierTxt"></span></div>
    <div class="status">
      <div class="unit">
        <div class="uname"><span class="nm" id="heroName">용사</span><span class="lv">Lv.<b id="heroLv">1</b></span></div>
        <div class="bar hp" id="heroHpWrap"><i id="heroHpBar"></i><span id="heroHpTxt">HP</span></div>
        <div class="bar exp"><i id="heroExpBar"></i><span id="heroExpTxt">EXP</span></div>
      </div>
      <div class="unit">
        <div class="uname"><span class="nm" id="monName">몬스터</span><span class="lv">Lv.<b id="monLv">1</b></span></div>
        <div class="mstars"><span class="st" id="monStars">★</span><span class="en" id="monEn"></span></div>
        <div class="bar mhp"><i id="monHpBar"></i><span id="monHpTxt">HP</span></div>
      </div>
    </div>
    <div id="bossBar" hidden><div class="bbtop"><span class="bbtag">⚠ BOSS</span><span id="bossName"></span><span id="bossStars"></span></div>
      <div class="bbar"><i id="bossTrail"></i><i id="bossFill"></i><span id="bossHpTxt"></span></div></div>
    <div id="stage">
      <div id="heroSprite" class="sprite"><span>🦸</span><i class="acc" id="heroAcc"></i></div>
      <div id="vs">VS</div>
      <div id="monSprite" class="sprite"><span></span></div>
      <div id="slash"></div>
      <div id="bossSkill"></div>
    </div>
    <div class="statline">
      <span>⚔️ 공격력 <b id="atkTxt">10</b></span>
      <span>🪙 <b id="goldTxt">0</b> G</span>
      <span class="cmb">🔥 콤보 <b id="comboTxt">0</b></span>
      <span>🗡️ <b id="weaponTxt">나무 검</b></span>
      <span>🔮 부적 <b id="charmTxt">0</b></span>
    </div>
  </section>

  <!-- 우측 상단: 쌓기나무 입체 -->
  <section id="scenePanel" class="panel">
    <div class="scenehead"><span id="sceneLabel">📦 쌓은 모양</span><span id="lockBadge">🔒 문제를 풀면 돌려 볼 수 있어요</span></div>
    <div id="canvasWrap"><canvas id="scene"></canvas><div id="hintLabel" hidden></div></div>
    <div class="viewbtns" id="viewBtns">
      <button data-view="def">↺ 처음 방향</button>
      <button data-view="front">👁 앞</button>
      <button data-view="side">👁 옆</button>
      <button data-view="top">👁 위</button>
    </div>
  </section>

  <!-- 하단: 문제 -->
  <section id="quiz" class="panel">
    <div class="qhead"><span id="qTag" class="chip">준비</span><span id="qNo"></span></div>
    <div id="timer" hidden><span id="diffChip"></span><div class="tbar"><i id="timerBar"></i></div><span id="timerTxt">1:00</span></div>
    <div id="qText">모험을 시작해 볼까요?</div>
    <div id="qHint" hidden></div>
    <div id="qFigs"></div>
    <div id="options"></div>
    <div id="feedback" hidden>
      <div class="fbtitle" id="fbTitle"></div>
      <div class="fbexp" id="fbExp"></div>
      <div class="fbrow"><button class="big" id="btnNext">다음 문제 ▶</button></div>
    </div>
    <div class="actions">
      <button id="btnHint" title="방향 하나 공개 (H)">💡 힌트 <b id="hintCnt">0</b></button>
      <button id="btnPotion" title="HP 50% 회복 (P)">🧪 물약 <b id="potionCnt">0</b></button>
      <button id="btnShop" title="상점 (S)">🛒 상점</button>
    </div>
  </section>
</main>

<div id="cine" hidden>
  <div class="cine-rays"></div>
  <div class="cine-floor" id="cineFloor">1층 입성!</div>
  <div class="cine-sub" id="cineSub"></div>
  <div class="cine-hero"><div class="aura"></div><span id="cineHero"></span><i class="acc" id="cineAcc"></i></div>

  <div class="cine-stats" id="cineStats"></div>
  <div class="cine-flash"></div>

<div id="concept" hidden>
  <div class="cp-box" role="dialog" aria-label="개념 원리 탑 탐험">

    <div id="cpBody">
      <div class="cp-visual"><div class="cp-alts" id="cpAlts" hidden></div><div id="cpCwrap"><canvas id="cpCanvas"></canvas></div><div class="cp-ctl" id="cpCtl"></div></div>
      <div class="cp-right" id="cpRight"></div>
    </div>
    <div class="cp-nav"><button class="navbtn" id="cpPrev">◀ 이전</button><div class="cp-dots" id="cpDots"></div><span class="cp-bonus" id="cpBonus"></span><button class="navbtn" id="cpTower">⚔️ 탑 도전 시작</button><button class="navbtn" id="cpNext">다음 ▶</button></div>
  </div>
</div>
<div id="ending" hidden>

function solveViews(top, front, side) {
  const R = top.length, C = top[0].length, cells = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (top[r][c]) cells.push([r, c, Math.min(front[c], side[R - 1 - r])]);
  const cur = Array.from({ length: R }, () => Array(C).fill(0));
  const res = { count: 0, minS: Infinity, maxS: -Infinity, minSol: null, maxSol: null };
  const ok = () => {
    for (let c = 0; c < C; c++) { let m = 0; for (let r = 0; r < R; r++) m = Math.max(m, cur[r][c]); if (m !== front[c]) return false; }
    for (let r = 0; r < R; r++) if (Math.max(...cur[r]) !== side[R - 1 - r]) return false;
    return true;
  };
  (function rec(i, s) {
    if (i === cells.length) {
      if (ok()) {
        res.count++;
        if (s < res.minS) { res.minS = s; res.minSol = clone(cur); }
        if (s > res.maxS) { res.maxS = s; res.maxSol = clone(cur); }
      }
      return;
    }
    const [r, c, cap] = cells[i];
    for (let v = 1; v <= cap; v++) { cur[r][c] = v; rec(i + 1, s + v); }
    cur[r][c] = 0;
  })(0, 0);
  return res;
}

function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r); ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r); ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
}
function drawScene(ctx, W, H, o) {
  ctx.clearRect(0, 0, W, H);
  const h = o.h, R = h.length, C = h[0].length, mH = Math.max(1, maxOf(h));
  const k = camVec(o.az, o.el);
  const ox = -C / 2, oy = -R / 2;
  // 현재 시점에서 보이는 범위에 맞춰 크기 자동 조절 (받침판·방향 표시 포함)
  const U = (x, y) => x * k.ca - y * k.sa, V = (x, y, z) => -k.se * (x * k.sa + y * k.ca) + z * k.ce;
  let u0 = Infinity, u1 = -Infinity, w0 = Infinity, w1 = -Infinity;
  const zTop = o.mode === 'solid' ? mH : mH + 1.3;
  for (const x of [ox - 0.6, -ox + 0.6, ox + C + 1.3]) for (const y of [oy - 0.6, -oy + 0.6, oy + R + 1.3]) for (const z of [0, zTop]) {
    const uu = U(x, y), vv = V(x, y, z); u0 = Math.min(u0, uu); u1 = Math.max(u1, uu); w0 = Math.min(w0, vv); w1 = Math.max(w1, vv);
  }
  const sc = Math.min(W * 0.9 / Math.max(0.5, u1 - u0), H * 0.88 / Math.max(0.5, w1 - w0), Math.min(W, H) / 3.2);
  const uc = (u0 + u1) / 2, vc = (w0 + w1) / 2, cx = W / 2, cy = H / 2;
  const P = (x, y, z) => [cx + (U(x, y) - uc) * sc, cy - (V(x, y, z) - vc) * sc];
  const dv = [k.ce * k.sa, k.ce * k.ca, k.se];
  ctx.lineJoin = 'round';

    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();

  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {

    poly([P(x, y, 0), P(x + 1, y, 0), P(x + 1, y + 1, 0), P(x, y + 1, 0)], (o.tint && on) ? 'rgba(255,209,102,.42)' : 'rgba(255,255,255,.05)', 'rgba(255,255,255,.25)', 1);
  }

    const fs = clamp(sc * 0.34, 10, 16);

      ctx.fillStyle = '#2a1f5c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, pt[0], pt[1] + 1);
    };

  };

    if (o.nums) {
      ctx.font = `${Math.max(12, sc * 0.55)}px Jua, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (h[r][c]) {
        const p = P(ox + c + 0.5, oy + r + 0.5, 0);
        ctx.fillStyle = '#ffe6a6'; ctx.fillText(String(h[r][c]), p[0], p[1]);
      }
    }
    const bob = Math.sin((o.time || 0) / 420) * sc * 0.12;
    const p = P(0, 0, mH * 0.85 + 0.5);
    ctx.save();
    ctx.font = `${Math.max(36, sc * 1.6)}px Jua, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255,209,102,.9)'; ctx.shadowBlur = 24; ctx.fillStyle = '#ffd166';

  }

  const base = o.color || PAL[1], hl = new Set(o.hl || []);
  const palMemo = {}, palOf = b => palMemo[b] || (palMemo[b] = { top: shade(b, 1.14), front: shade(b, 0.93), right: shade(b, 0.74), left: shade(b, 0.84), back: shade(b, 0.66), stroke: shade(b, 0.4) });
  const cubes = [];
  for (let z = 0; z < mH; z++) for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (z < h[r][c]) cubes.push({ r, c, z });

  const list = [];
  cubes.forEach((q, i) => {
    let dz = 0;
    if (drop) {
      const p = clamp((drop.t - i * gap) / dur, 0, 1);
      if (p <= 0) return;
      dz = 4.5 * Math.pow(1 - p, 3);
    }
    const X = ox + q.c + 0.5, Y = oy + q.r + 0.5, Z = q.z + 0.5 + dz;
    list.push({ ...q, dz, d: X * dv[0] + Y * dv[1] + Z * dv[2] });
  });
  list.sort((a, b) => a.d - b.d);
  const lw = clamp(sc * 0.035, 1, 2.2);
  for (const q of list) {
    const X = ox + q.c, Y = oy + q.r, Z = q.z + q.dz, cull = !drop;
    const F = [
      ['top', [0, 0, 1], [[X, Y, Z + 1], [X + 1, Y, Z + 1], [X + 1, Y + 1, Z + 1], [X, Y + 1, Z + 1]], [q.r, q.c, q.z + 1]],
      ['front', [0, 1, 0], [[X, Y + 1, Z], [X + 1, Y + 1, Z], [X + 1, Y + 1, Z + 1], [X, Y + 1, Z + 1]], [q.r + 1, q.c, q.z]],
      ['back', [0, -1, 0], [[X, Y, Z], [X + 1, Y, Z], [X + 1, Y, Z + 1], [X, Y, Z + 1]], [q.r - 1, q.c, q.z]],
      ['right', [1, 0, 0], [[X + 1, Y, Z], [X + 1, Y + 1, Z], [X + 1, Y + 1, Z + 1], [X + 1, Y, Z + 1]], [q.r, q.c + 1, q.z]],
      ['left', [-1, 0, 0], [[X, Y, Z], [X, Y + 1, Z], [X, Y + 1, Z + 1], [X, Y, Z + 1]], [q.r, q.c - 1, q.z]],
    ];
    for (const [name, n, pts, nb] of F) {
      if (n[0] * dv[0] + n[1] * dv[1] + n[2] * dv[2] <= 1e-6) continue;
      if (cull && has(nb[0], nb[1], nb[2])) continue;

    }

const TIME = { easy: 60, hard: 120 };
const HARD = new Set(['which3d', 'views2count', 'cube3d', 'numFront', 'numSide', 'num3d', 'minmax', 'cubeNum', 'g5sketchDraw', 'g5netIs', 'g5netFace', 'g5edgeSum']);
const isBoss = f => f % 7 === 0;
/* 몬스터 HP = (100 + 층×25) × 등급 배율 × 보스 배율
   등급 배율: ★1=1.0, ★2=1.1 … ★5=1.4 (공격력도 ★마다 +12%) / 보스: HP ×1.5, 공격력 ×1.4 */
const starMul = st => 1 + (st - 1) * 0.1;
const starAtkMul = st => 1 + (st - 1) * 0.12;
function makeMonster(f) {
  const d = MONSTERS[f - 1], boss = !!d.boss;
  const hp = Math.round((100 + f * 25) * starMul(d.star) * (boss ? 1.5 : 1) * GR().hpMul);   // 학년 배율: 3학년 0.5 … 6학년 1.0
  return { ...d, name: d.ko, boss, hp, maxHp: hp, floor: f };
}
function monsterDamage(M, f, H) {
  return Math.max(1, Math.round((10 + f * 1.6) * starAtkMul(M.star) * (M.boss ? 1.4 : 1) * (0.9 + Math.random() * 0.2) * (clsOf(H).id === 'knight' ? 0.8 : 1) * GR().atkMul));
}
const DEX_KEY = 'space-tower-dex';
function dexGet() { const a = safeJSON(Store.get(DEX_KEY), []); return new Set(Array.isArray(a) ? a.filter(n => Number.isInteger(n) && n >= 1 && n <= 21) : []); }

let G = null, TOK = 0;
const later = (fn, ms) => { const t = TOK; return setTimeout(() => { if (t === TOK) fn(); }, ms); };

function newGame(name, preset, cls, grade, bonus, done) {
  TOK++;
  const P = { 1: { lv: 1, w: 0, gold: 0, hints: 1, potions: 1 }, 8: { lv: 5, w: 1, gold: 300, hints: 2, potions: 2 }, 15: { lv: 9, w: 2, gold: 700, hints: 3, potions: 3 } }[preset] || { lv: 1, w: 0, gold: 0, hints: 1, potions: 1 };
  G = {
    floor: preset || 1,
    hero: { name: name || '용사', cls: CLASSES[cls] ? cls : 'knight', lv: P.lv, exp: 0, hp: 0, maxHp: 0, weapon: P.w, gold: P.gold, hints: P.hints + (cls === 'mage' ? 2 : 0), potions: P.potions, charms: 0, bless: (preset || 1) - 1, blessed: (preset || 1) - 1 },
    mon: null, q: null, qNo: 0, combo: 0, phase: 'idle', lastType: null,
    stats: { correct: 0, wrong: 0, tier: [{ c: 0, w: 0 }, { c: 0, w: 0 }, { c: 0, w: 0 }], best: 0, hints: 0, goldEarned: 0, expEarned: 0, start: Date.now() },
    seen: [false, false, false], grade: GRADES[grade] ? grade : 6, conceptDone: [...(done || [])],
  };
  G.hero.maxHp = calcMaxHp(G.hero); G.hero.hp = G.hero.maxHp;
  if (bonus && (bonus.gold || bonus.exp || bonus.hints || bonus.potions)) {
    const H = G.hero;
    H.gold += bonus.gold || 0; H.hints += bonus.hints || 0; H.potions += bonus.potions || 0;
    G.stats.goldEarned += bonus.gold || 0; G.stats.expEarned += bonus.exp || 0;
    if (bonus.exp) gainExp(bonus.exp);
    H.hp = H.maxHp;
    setTimeout(() => toast(`🎓 개념 학습 보상 🪙+${bonus.gold || 0} ✨+${bonus.exp || 0}${bonus.hints ? ` 💡+${bonus.hints}` : ''}${bonus.potions ? ` 🧪+${bonus.potions}` : ''}`), 400);
  }
  startFloor();
}
function saveGame() {
  if (!G) return;
  try { Store.set(SAVE_KEY, JSON.stringify({ v: 1, floor: G.floor, hero: G.hero, stats: G.stats, seen: G.seen, combo: G.combo, grade: G.grade, conceptDone: G.conceptDone || [] })); } catch (e) {}
}
function loadSave() {
  try { const s = safeJSON(Store.get(SAVE_KEY), null); if (s && s.v === 1 && s.floor >= 1 && s.floor <= 21 && s.hero && typeof s.hero === 'object' && s.stats && Array.isArray(s.stats.tier)) return s; } catch (e) {}

}
function clearSave() { Store.remove(SAVE_KEY); }
function continueGame(s) {
  TOK++;

function pop(target, txt, cls) {

  const d = document.createElement('div'); d.className = 'pop ' + cls; d.textContent = txt;

/* 직업별 공격: 기사=돌진 베기, 마법사=마법 구슬, 궁수=화살, 탐험가=큐브 던지기 */
function heroAttack(dmg, crit) {
  const hs = $('#heroSprite'), ms = $('#monSprite'), sl = $('#slash'), cid = clsOf(G.hero).id, st = $('#stage');
  const hit = () => {
    const sr = st.getBoundingClientRect(), mr = ms.getBoundingClientRect();
    const cx = mr.left - sr.left + mr.width / 2, cy = mr.top - sr.top + mr.height / 2;
    if (cid === 'knight') { sl.style.left = (cx - 75) + 'px'; sl.style.top = cy + 'px'; restartAnim(sl, 'on'); }
    else {
      const bu = document.createElement('div'); bu.className = 'burst';
      bu.style.left = cx + 'px'; bu.style.top = cy + 'px'; bu.style.setProperty('--bc', { mage: '#c8a8ff', archer: '#7af0ff', explorer: '#ffd166' }[cid]);
      st.appendChild(bu); setTimeout(() => bu.remove(), 500);

    Snd.play(crit ? 'crit' : 'hit');

  if (cid === 'knight') { hs.style.setProperty('--dx', lungeDist()); restartAnim(hs, 'atk'); later(hit, 200); return; }

}
function shootProjectile(kind, done) {
  const st = $('#stage'), sr = st.getBoundingClientRect(), hr = $('#heroSprite').getBoundingClientRect(), mr = $('#monSprite').getBoundingClientRect();
  const d = document.createElement('div'); d.className = 'proj ' + kind;
  if (kind === 'arrow') d.innerHTML = '<svg viewBox="0 0 56 14"><path d="M2 7 H46" stroke="#e8c07a" stroke-width="3"/><path d="M44 1 L56 7 L44 13 Z" fill="#c8a8ff" stroke="#6b3fbf"/><path d="M2 7 l6 -6 h5 l-6 6 6 6 h-5z" fill="#3fae5a"/></svg>';
  if (kind === 'cube') d.innerHTML = `<svg viewBox="0 0 30 30">${isoCube(15, 3, 11, '#d9a86c', 1.3)}</svg>`;
  const x0 = hr.left - sr.left + hr.width * 0.75, y0 = hr.top - sr.top + hr.height * 0.45;
  const x1 = mr.left - sr.left + mr.width / 2, y1 = mr.top - sr.top + mr.height / 2, dx = x1 - x0, dy = y1 - y0;
  d.style.left = x0 + 'px'; d.style.top = y0 + 'px';
  st.appendChild(d);

    ? [{ transform: `${base} translate(0,0) rotate(0deg)` }, { transform: `${base} translate(${dx / 2}px,${dy / 2 - 55}px) rotate(220deg)` }, { transform: `${base} translate(${dx}px,${dy}px) rotate(440deg)` }]

function monsterAttack(dmg, blocked) {

      const sr = st.getBoundingClientRect(), hr = hs.getBoundingClientRect();

        const w = document.createElement('div'); w.className = 'shock';
        w.style.left = (hr.left - sr.left + hr.width / 2) + 'px'; w.style.top = (hr.top - sr.top + hr.height / 2) + 'px';
        st.appendChild(w); setTimeout(() => w.remove(), 750);

      restartAnim(hs, 'hit'); const fl = $('#flash'); fl.classList.add('boss'); restartAnim(fl, 'on'); setTimeout(() => fl.classList.remove('boss'), 600);

function showModal(html, cls) { $('#mbox').className = 'mbox' + (cls ? ' ' + cls : ''); $('#mbox').innerHTML = html; $('#modal').hidden = false; $('#mbox').scrollTop = 0; }

/* ---------------- 진행 ---------------- */
function startFloor(retry) {
  closeModal();
  const f = G.floor, H = G.hero;
  G.phase = 'cine';
  const oldRank = rankOf(Math.max(1, f - 1)), newRank = rankOf(f);
  let info = { retry: !!retry, bless: false, rankUp: false, oldRank, newRank };
  if ((H.blessed || 0) < f) {
    H.bless = (H.bless || 0) + 1; H.blessed = f;
    H.maxHp = calcMaxHp(H); H.hp = Math.min(H.maxHp, H.hp + 5);
    info.bless = true; info.rankUp = f > 1 && oldRank !== newRank;
  }
  G.mon = makeMonster(f); G.qNo = 0;
  Music.setMood(TIER(f), G.mon.boss);
  const ms = $('#monSprite');
  ms.classList.remove('dead', 'hit', 'matk'); ms.classList.toggle('isboss', G.mon.boss);
  ms.firstElementChild.innerHTML = monSVG(G.mon.key);
  restartAnim(ms, 'appear');
  renderHUD(); saveGame();
  $('#timer').hidden = true;
  const tok = TOK;
  playCine(f, info, () => {
    if (tok !== TOK) return;
    const b = document.createElement('div'); b.className = 'bubble';
    b.textContent = (G.mon.boss ? `[${G.mon.en}] ` : '') + (G.mon.line || pick(GR().taunts[TIER(f) - 1]));
    $('#stage').appendChild(b); setTimeout(() => b.remove(), 3100);
    restartAnim($('#monSprite'), 'appear');
    const t = TIER(f);
    if (!G.seen[t - 1]) { G.seen[t - 1] = true; saveGame(); showTierIntro(t, true); }
    else nextQuestion();
  });
}
/* 층 입성 연출: 층 이름 → 용사가 힘을 모음 → 번쩍! 업그레이드 → 능력치 표시 */
let CINE = null;
function playCine(f, info, done) {
  const el = $('#cine'), M = G.mon, H = G.hero;
  if (CINE) CINE.finish(true);
  const timers = [];
  const state = { finished: false };
  const finish = (silent) => {
    if (state.finished) return; state.finished = true;
    timers.forEach(clearTimeout); CINE = null;
    el.classList.add('out');
    setTimeout(() => { el.hidden = true; el.className = ''; if (!silent) done(); }, silent ? 0 : 330);
  };
  CINE = { finish };
  const R0 = info.rankUp ? info.oldRank : info.newRank, R1 = info.newRank;
  el.className = ''; el.style.setProperty('--aura', R0.aura); el.style.setProperty('--aura2', R1.aura);
  $('#cineFloor').textContent = info.retry ? `${f}층 재도전!` : f === 21 ? '21층 · 최종 결전!' : `${f}층 입성!`;
  const last = M.name.charCodeAt(M.name.length - 1), josa = last >= 0xAC00 && last <= 0xD7A3 && (last - 0xAC00) % 28 ? '이' : '가';
  $('#cineSub').innerHTML = (M.boss ? `<span style="color:#ff5c9a">⚠ ${M.final ? 'FINAL BOSS' : 'BOSS'} ⚠</span><br>` : '') + `${escapeHTML(M.ko)}(${escapeHTML(M.en)})${josa} 기다리고 있어요${M.boss ? '!' : ''} <span style="color:#ffd23f">${starStr(M.star)}</span>`;
  $('#cineAcc').textContent = R0.acc;
  $('#cineHero').innerHTML = charSVG(clsOf(H).id);
  $('#cineRank').className = 'cine-rank'; $('#cineRank').innerHTML = `${rankName(R0, H)} ${escapeHTML(H.name)}`;
  $('#cineStats').innerHTML = '';
  el.querySelectorAll('.spark').forEach(x => x.remove());
  el.hidden = false; el.onclick = () => finish();
  const T = (fn, ms) => timers.push(setTimeout(fn, ms));
  T(() => { el.classList.add('charge'); Snd.play('power'); }, 650);
  T(() => {
    el.classList.remove('charge'); el.classList.add('boom'); Snd.play('fanfare');
    $('#cineAcc').textContent = R1.acc;
    const rk = $('#cineRank');
    const n1 = `${rankName(R1, H)} ${escapeHTML(H.name)}`;
    rk.innerHTML = info.rankUp ? `<small>⭐ 전직! ⭐</small>${n1}` : info.retry ? `<small>다시 일어섰다!</small>${n1}` : `<small>탑의 축복을 받았다!</small>${n1}`;
    restartAnim(rk, 'new');
    for (let i = 0; i < 26; i++) {
      const sp = document.createElement('div'), a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 220;
      sp.className = 'spark'; sp.style.background = pick([R1.aura, '#fff', '#ffd166']);
      sp.style.setProperty('--sx', Math.cos(a) * d + 'px'); sp.style.setProperty('--sy', Math.sin(a) * d + 'px');
      el.appendChild(sp);
    }
    const chips = info.retry ? ['❤️ HP 가득 회복', `⚔️ 공격력 ${atkOf(H)}`]
      : info.bless ? ['⚔️ 공격력 +3', '❤️ 최대 HP +5', `🗡️ 지금 공격력 ${atkOf(H)}`].concat(info.rankUp ? [`${R1.acc} ${rankName(R1, H)}`] : [])
        : [`⚔️ 공격력 ${atkOf(H)}`, `❤️ HP ${H.hp}/${H.maxHp}`];
    $('#cineStats').innerHTML = chips.map((c, i) => `<span style="animation-delay:${0.25 + i * 0.22}s">${c}</span>`).join('');
  }, 1850);
  T(() => finish(), info.rankUp ? 4300 : 3800);
}
function nextQuestion() {

  G.q = q; G.lastType = q.type; q.hintUsed = false;
  renderQuestion(q);
  sceneSet(q.scene);
  const bonus = clsOf(G.hero).id === 'explorer' ? 20 : 0;
  q.hard = HARD.has(q.type) || !!q.forceHard; q.limit = ((q.hard ? TIME.hard : TIME.easy) + bonus) * 1000;
  G.tLeft = q.limit; G.tLast = performance.now(); G.lastSec = null;
  const dc = $('#diffChip'); dc.className = q.hard ? 'hard' : 'easy'; dc.textContent = (q.hard ? '🔥 어려움 · 2분' : '🌱 쉬움 · 1분') + (bonus ? ' +20초' : '');

function openShop(fromClear) {
  if (!G || (!fromClear && !['question', 'answered', 'busy'].includes(G.phase))) return;
  if (G.phase === 'busy') { toast('공격이 끝난 뒤에 열 수 있어요', 'warn'); return; }
  if (!fromClear && G.phase !== 'shop') G.backPhase = G.phase;
  if (!fromClear) G.phase = 'shop';
  const H = G.hero, f = G.floor;
  // 사고팔기: 소모품은 산 값의 절반에 되팔 수 있어요
  const row = (ic, nm, desc, btns) => `<div class="shopitem"><div class="ic">${ic}</div><div class="info"><b>${nm}</b><div>${desc}</div></div><div class="btns">${btns}</div></div>`;
  const bb = (id, can, label, sell) => `<button data-${sell ? 'sell' : 'buy'}="${id}" class="${sell ? 'sell' : ''}" ${can ? '' : 'disabled'}>${label}</button>`;
  const cons = [
    ['hint', '💡', '힌트 두루마리', H.hints, '방향 하나 공개! 입체를 다른 방향에서 보여 주거나 오답을 지워요' + (clsOf(H).id === 'mage' ? ' · 마법사 할인!' : ''), hintPrice(), 1],
    ['potion', '🧪', '회복 물약', H.potions, 'HP를 최대 HP의 50%만큼 회복해요', PRICE.potion, 1],
    ['charm', '🔮', '수호의 부적', H.charms || 0, '몬스터의 공격(보스 필살기 포함)을 한 번 자동으로 막아요', PRICE.charm, CHARM_FROM],
  ].map(([id, ic, nm, have, desc, price, from]) => f < from
    ? row(ic, nm, `🔒 ${from}층부터 판매해요`, bb(id, false, `🔒 ${from}층`))
    : row(ic, `${nm} (보유 ${have})`, desc, bb(id, H.gold >= price, `사기 🪙${price}`) + bb(id, have > 0, `팔기 +${sellPrice(price)}`, true))).join('');
  const wrows = WEAPONS.slice(1).map((w, i0) => {
    const i = i0 + 1, nm = weaponName(H, i);
    if (i <= H.weapon) return row(w.icon, nm, `공격력 +${w.atk}`, bb('w' + i, false, i === H.weapon ? '장착 중' : '보유'));
    if (f < w.from) return row(w.icon, nm, `공격력 +${w.atk} · 🔒 ${w.from}층부터 판매해요`, bb('w' + i, false, `🔒 ${w.from}층`));
    if (i === H.weapon + 1) return row(w.icon, nm, `공격력 +${w.atk} (지금보다 +${w.atk - WEAPONS[H.weapon].atk}) · 지금 장비는 🪙${sellPrice(WEAPONS[H.weapon].price)}에 보상 판매`, bb('w' + i, H.gold + sellPrice(WEAPONS[H.weapon].price) >= w.price, `🪙 ${w.price}`));
    return row(w.icon, nm, `공격력 +${w.atk} · 앞 단계 장비가 먼저 필요해요`, bb('w' + i, false, `🪙 ${w.price}`));
  }).join('');
  showModal(`<h2>🛒 공간의 탑 상점</h2><div class="goldline">보유 골드 🪙 ${H.gold} G</div>
    <p style="text-align:center;color:var(--muted);font-size:13px;margin:4px 0 0">층이 올라갈수록 새 상품이 들어와요 · 소모품은 반값에 되팔 수 있어요</p>
    <h3>소모품</h3>${cons}
    <h3>장비 (공격력 증가)</h3>${wrows}
    <div class="mrow"><button class="big" id="mClose">닫기</button></div>`);
  $$('#mbox [data-buy]').forEach(b => b.addEventListener('click', () => { buy(b.dataset.buy); openShop(fromClear); }));
  $$('#mbox [data-sell]').forEach(b => b.addEventListener('click', () => { sell(b.dataset.sell); openShop(fromClear); }));
  $('#mClose').onclick = () => { if (fromClear) floorClear(true); else { closeModal(); G.phase = G.backPhase || 'question'; } };
}
const ITEMKEY = { hint: 'hints', potion: 'potions', charm: 'charms' };
const itemPrice = id => (id === 'hint' ? hintPrice() : PRICE[id]);
function buy(id) {
  const H = G.hero;
  if (ITEMKEY[id]) {
    if (id === 'charm' && G.floor < CHARM_FROM) return;
    if (H.gold < itemPrice(id)) return;
    H.gold -= itemPrice(id); H[ITEMKEY[id]] = (H[ITEMKEY[id]] || 0) + 1;
  } else if (id[0] === 'w') {
    const i = +id.slice(1), w = WEAPONS[i], trade = sellPrice(WEAPONS[H.weapon].price);
    if (!w || i !== H.weapon + 1 || G.floor < w.from || H.gold + trade < w.price) return;
    H.gold = H.gold + trade - w.price; H.weapon = i;
    toast(`${w.icon} ${weaponName(H, i)} 장착! 공격력 ${atkOf(H)}`);
  } else return;
  Snd.play('buy'); renderHUD(); saveGame();
}
function sell(id) {
  const H = G.hero, k = ITEMKEY[id];
  if (!k || !(H[k] > 0)) return;
  H[k]--; H.gold += sellPrice(itemPrice(id));
  Snd.play('coin'); renderHUD(); saveGame();
}

  if (!ok && btns[pickI]) btns[pickI].classList.add('wrong');

function cpNext() {
  const slides = cpSlides();
  if (slides[CP.si].type === 'check' && !CP.qDone) return;
  if (CP.si < slides.length - 1) { CP.si++; renderCP(); }
  else if (CP.ch < 2) cpGoChapter(CP.ch + 1);
}
function cpPrev() { if (CP.si > 0) { CP.si--; renderCP(); } }
function cpGoChapter(i) { CP.ch = i; CP.si = 0; CP.q = null; renderCP(); }
function cpExit(toTower, preset) {

  closeConcept();
  if (CP.inGame) { Music.setMood(TIER(G.floor), G.mon && G.mon.boss); if (o.onExit) o.onExit(); return; }
  if (toTower) newGame(o.name, preset || 1, o.cls, CP.grade, CP.bonus, [...CP.done]);

}
function cpInit() {

    const v = b.dataset.cv;
    if (v === 'fold') { CV.foldT = CV.fold > 0.5 ? 0 : 1; Snd.play('tick'); return; }
    if (v === 'spin') { CV.spin = !CV.spin; return; }
    const V = { def: [DEF_AZ, defaultEl(CV.spec.kind)], front: [0, 0], side: [90, 0], top: [0, 90], back: [215, 30] }[v];
    if (V) { cvAim(V[0], V[1]); Snd.play('tick'); }
  });
  $('#cpRight').addEventListener('click', e => {
    const o = e.target.closest('#cpOpts .opt'); if (o && !o.disabled) { cpShowAnswer(+o.dataset.i); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;

  // 처음 화면 뒤에 보일 기본 장면
  G = { floor: 1, hero: { name: '용사', lv: 1, exp: 0, hp: 100, maxHp: 100, weapon: 0, gold: 0, hints: 1, potions: 1, bless: 0, blessed: 0, cls: 'knight' }, grade: 6, mon: null, combo: 0, phase: 'idle', stats: null, seen: [false, false, false] };

let ERR_SHOWN = false;
function reportError(msg) {
  const m = String(msg || '');
  if (/ResizeObserver loop|Script error\.?$|NotAllowedError|AbortError/i.test(m)) return;   // 브라우저가 내는 무해한 알림
  console.error('[공간의 탑]', m);
  if (ERR_SHOWN) return; ERR_SHOWN = true;
  try { toast('⚠️ 잠깐 문제가 생겼어요. 계속 안 되면 새로고침(F5) 해 주세요', 'warn'); } catch (e) {}
}
window.addEventListener('error', e => reportError(e && (e.message || (e.error && e.error.message))));
window.addEventListener('unhandledrejection', e => reportError(e && e.reason && (e.reason.message || e.reason)));
function safeBoot() {
  try { boot(); }
  catch (e) {
    console.error(e);
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:24px;background:#05041a;color:#f3eeff;font:16px/1.7 sans-serif;text-align:center';
    d.innerHTML = '게임을 시작하지 못했어요.<br>최신 크롬·엣지·사파리·웨일 브라우저에서 열거나 새로고침해 주세요.<br><small style="opacity:.6">' + String(e && e.message || e).replace(/[<>&]/g, '') + '</small>';
    document.body.appendChild(d);
  }
}
